# Diagnostic only, on its own branch: repeat runs and settings on the fixed build.
name: Result comparison
on:
  push:
    branches: [intel-diag]
permissions:
  actions: read
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: arm64
            runner: macos-15
            parallel: '0'
            runs: a3:3 b3:3 a1:1 b1:1
          - chip: x86_64
            runner: macos-15-intel
            parallel: '1'
            runs: a1:1 b1:1 f1:1:ftz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Compiling_tools/macos
          filter: blob:none
      - name: Programs from the fixed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41335588534 -R ${{ github.repository }} -n simflate-opencourant-macos-${{ matrix.chip }} -D pkg
          chmod +x pkg/exec/*
          if [ "${{ matrix.chip }}" = x86_64 ]; then clang -O1 -dynamiclib -o ftz.dylib Compiling_tools/macos/diag/ftz.c; fi
      - name: Full runs
        timeout-minutes: 130
        env:
          PARALLEL: ${{ matrix.parallel }}
        run: bash Compiling_tools/macos/diag/run.sh ${{ matrix.runs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-${{ matrix.chip }}
          path: results/
