# Diagnostic only, on its own branch: the unset node count in the Apple-silicon
# starter that shipped in Simflate 1.1.2, read at the moment the stub is called.
name: Apple silicon count check
on:
  push:
    branches: [intel-diag]
permissions:
  actions: read
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Compiling_tools/macos
          filter: blob:none
      - name: Shipped programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41218041420 -R ${{ github.repository }} -n simflate-opencourant-macos-arm64 -D pkg
          chmod +x pkg/exec/*
          cat pkg/BUILD.txt
          sysctl -n machdep.cpu.brand_string; sw_vers -productVersion
      - name: Read the count
        timeout-minutes: 6
        run: |
          mkdir r && cp Compiling_tools/macos/test/model.k r/ && cd r
          export RAD_CFG_PATH=$GITHUB_WORKSPACE/pkg/hm_cfg_files KMP_STACKSIZE=400m
          for i in 1 2 3; do
            /usr/bin/time -p ../pkg/exec/starter_macosa64_gf_sp -i model.k -np 1 </dev/null 2>&1 >/dev/null | tr '\n' ' '; echo
          done
          lldb -b -o 'breakpoint set -n cpp_python_get_number_of_nodes' \
            -o 'process launch -i /dev/null -o /dev/null -e /dev/null' \
            -o 'memory read -s4 -fd -c1 $x0' -o 'kill' \
            -- ../pkg/exec/starter_macosa64_gf_sp -i model.k -np 1 </dev/null 2>&1 | tail -12
